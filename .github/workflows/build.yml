name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable
        check-latest: true

    # Each gate is a separate step so failures stay legible in the UI, but the
    # commands live in the Makefile so `make check` and CI cannot drift apart.
    - name: Check formatting
      run: make fmt-check

    - name: Lint (vet + staticcheck)
      run: make lint

    - name: Vulnerability check
      run: make vulncheck

    - name: Test
      run: make test

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable
        check-latest: true

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: '0'
      run: |
        go build -trimpath -v -o bin/go-parse-${GOOS}-${GOARCH} ./cmd/go-parse
        go build -trimpath -v -o bin/go-parse-scan-${GOOS}-${GOARCH} ./cmd/go-parse-scan

    - name: Upload go-parse binary
      uses: actions/upload-artifact@v7
      with:
        name: go-parse-${{ matrix.goos }}-${{ matrix.goarch }}
        path: bin/go-parse-${{ matrix.goos }}-${{ matrix.goarch }}

    - name: Upload go-parse-scan binary
      uses: actions/upload-artifact@v7
      with:
        name: go-parse-scan-${{ matrix.goos }}-${{ matrix.goarch }}
        path: bin/go-parse-scan-${{ matrix.goos }}-${{ matrix.goarch }}
