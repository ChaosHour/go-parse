name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files are not gofmt-clean:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...

    - name: Vulnerability check
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: Test
      run: go test -race -v ./...

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: '0'
      run: |
        go build -trimpath -v -o bin/go-parse-${GOOS}-${GOARCH} ./cmd/go-parse
        go build -trimpath -v -o bin/go-parse-scan-${GOOS}-${GOARCH} ./cmd/go-parse-scan

    - name: Upload go-parse binary
      uses: actions/upload-artifact@v7
      with:
        name: go-parse-${{ matrix.goos }}-${{ matrix.goarch }}
        path: bin/go-parse-${{ matrix.goos }}-${{ matrix.goarch }}

    - name: Upload go-parse-scan binary
      uses: actions/upload-artifact@v7
      with:
        name: go-parse-scan-${{ matrix.goos }}-${{ matrix.goarch }}
        path: bin/go-parse-scan-${{ matrix.goos }}-${{ matrix.goarch }}
